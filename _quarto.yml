project:
  type: website
  output-dir: _site
  # app/ is copied verbatim — the engine is plain ES modules, no bundler.
  #
  # CNAME must be build output: quarto-actions/publish force-pushes _site to
  # gh-pages on every deploy, so a CNAME written only by the Pages setting is
  # wiped on the next build. The research site released raccoonbg.com when its
  # own CNAME moved to research.raccoonbg.com — only one repo may claim a
  # domain.
  resources:
    - CNAME
    - app/**
    # Redirect stubs for the research pages that used to live at this domain
    # and for the pages this site renamed, plus the catch-all 404. Plain HTML,
    # copied verbatim — the render list only picks up .qmd.
    - "*.html"
  render:
    - "*.qmd"

website:
  title: "Raccoon Backgammon"
  description: "A free, open neural engine for backgammon — play it and analyse positions in your browser, nothing to install"
  site-url: https://raccoonbg.com
  favicon: app/assets/favicon.svg
  open-graph: true
  twitter-card: true
  page-footer:
    left: "**{{< var company.name >}}** · CVR {{< var company.cvr >}} · {{< var company.country >}}"
    center: "[{{< var company.email >}}](mailto:{{< var company.email >}})"
    right: "[Privacy](privacy.qmd) · [Terms](terms.qmd) · [Changelog](changelog.qmd) · [Research](https://research.raccoonbg.com)"
  navbar:
    title: "Raccoon Backgammon"
    left:
      - text: "What"
        file: index.qmd
      - text: "Who"
        file: who.qmd
      - text: "How"
        file: how.qmd
      - text: "Roadmap"
        file: roadmap.qmd
      - text: "Strength"
        file: strength.qmd
      # Both live surfaces of the product stay one click from every page.
      - text: "Play"
        menu:
          - text: "Play a game"
            file: play.qmd
          - text: "Analyse a position"
            file: analyse.qmd

format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    anchor-sections: false
    include-after-body: app/loader.html
