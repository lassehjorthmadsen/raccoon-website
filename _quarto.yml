project:
  type: website
  output-dir: _site
  # app/ is copied verbatim — the engine is plain ES modules, no bundler.
  #
  # CNAME must be build output: quarto-actions/publish force-pushes _site to
  # gh-pages on every deploy, so a CNAME written only by the Pages setting is
  # wiped on the next build. The research site released raccoonbg.com when its
  # own CNAME moved to research.raccoonbg.com — only one repo may claim a
  # domain.
  resources:
    - CNAME
    - app/**
    # Redirect stubs for the research pages that used to live at this domain,
    # plus the catch-all 404. Plain HTML, copied verbatim — the render list
    # only picks up .qmd.
    - "*.html"
  render:
    - "*.qmd"

website:
  title: "Raccoon Backgammon"
  description: "A modern neural engine for backgammon — play it and analyse positions in your browser"
  site-url: https://raccoonbg.com
  favicon: app/assets/favicon.svg
  open-graph: true
  twitter-card: true
  page-footer:
    left: "**{{< var company.name >}}** · CVR {{< var company.cvr >}} · {{< var company.country >}}"
    center: "[{{< var company.email >}}](mailto:{{< var company.email >}})"
    right: "[Privacy](privacy.qmd) · [Terms](terms.qmd) · [Research](https://research.raccoonbg.com)"
  navbar:
    title: "Raccoon Backgammon"
    left:
      - text: "Play"
        file: play.qmd
      - text: "Analyse"
        file: analyse.qmd
      - text: "Engine"
        file: engine.qmd
      - text: "Research"
        href: https://research.raccoonbg.com
      - text: "Changelog"
        file: changelog.qmd
    right:
      - text: "Team"
        file: team.qmd
      - text: "Contact"
        file: contact.qmd

format:
  html:
    theme: cosmo
    css: styles.css
    toc: false
    anchor-sections: false
    include-after-body: app/loader.html
